
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieHub - Jelajahi Film</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar navbar-expand-lg">
    <div class="container-fluid px-3 px-lg-5">
      <a class="navbar-brand" href="#" id="homeBtn">Movie<span>Hub</span></a>
      <div class="d-flex gap-2 ms-auto">
        <button class="nav-btn active" id="discoverBtn">Jelajahi</button>
        <button class="nav-btn" id="collectionBtn">
          Koleksi <span id="collectionCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container-fluid px-3 px-lg-5">
    <section class="hero">
      <p class="eyebrow">TEMUKAN FILM FAVORITMU</p>
      <h1>Dunia film ada<br>di <span>ujung jarimu.</span></h1>
      <p class="hero-text">Cari film favoritmu, temukan cerita baru, dan simpan film yang ingin kamu tonton.</p>

      <form id="searchForm" class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Cari judul film..." autocomplete="off" required>
        <button type="submit" id="searchBtn">Cari Film</button>
      </form>
    </section>

    <section class="movies-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow" id="sectionEyebrow">PILIHAN UNTUKMU</p>
          <h2 id="sectionTitle">Jelajahi Film</h2>
        </div>
        <p id="resultCount" class="result-count"></p>
      </div>

      <div id="message" class="message" role="status" aria-live="polite">
        Memuat film...
      </div>

      <div id="movieGrid" class="movie-grid"></div>
    </section>
  </main>

  <footer>
    <a class="footer-brand" href="#">Movie<span>Hub</span></a>
    <p>Temukan cerita yang cocok untukmu.</p>
    <small>© <span id="currentYear"></span> MovieHub</small>
  </footer>
</body>
</html>
